<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<title>3 Words a Day</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7fb;color:#172033}
.app{max-width:560px;margin:auto;min-height:100vh;padding:18px 16px 32px}
header{text-align:center;padding:10px 0 18px} h1{margin:0;font-size:30px} .tag{margin:6px 0 0;color:#60708a}
.card{background:white;border-radius:22px;padding:20px;margin:12px 0;box-shadow:0 5px 20px rgba(20,40,80,.08)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px} .day{font-weight:700;color:#1f6feb}
.word{font-size:31px;font-weight:800;margin:12px 0 5px} .meaning{font-size:17px;color:#52627a}
.example{margin-top:14px;padding:14px;background:#f1f6ff;border-radius:14px;line-height:1.5}
button{border:0;border-radius:14px;padding:12px 16px;font-weight:700;font-size:15px;cursor:pointer}
.primary{background:#1f6feb;color:white} .secondary{background:#e9eef7;color:#25344d}
.actions{display:flex;gap:9px;margin-top:14px} .actions button{flex:1}
.nav{display:flex;gap:10px;margin:14px 0} .nav button{flex:1}
.progress{height:9px;background:#e3e9f2;border-radius:9px;overflow:hidden} .bar{height:100%;background:#1f6feb;width:0}
.small{font-size:13px;color:#65748b} .center{text-align:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center} .stat{background:#f6f8fb;border-radius:14px;padding:12px} .num{font-size:22px;font-weight:800}
input{width:100%;padding:12px;border:1px solid #d7deea;border-radius:12px;font-size:16px}
footer{text-align:center;color:#718096;font-size:12px;margin-top:20px}
</style>
</head>
<body>
<div class="app">
<header>
<h1>3 Words a Day</h1>
<div class="tag">Small Steps. Better Every Day.</div>
</header>

<div class="card">
<div class="top"><span id="date"></span><span class="day" id="day"></span></div>
<div style="margin-top:12px" class="progress"><div class="bar" id="bar"></div></div>
<p class="small" id="progressText"></p>
</div>

<div id="words"></div>

<div class="nav">
<button class="secondary" onclick="changeDay(-1)">← Previous</button>
<button class="secondary" onclick="changeDay(1)">Next →</button>
</div>

<div class="card center">
<div class="stats">
<div class="stat"><div class="num" id="learned">0</div><div class="small">Learned</div></div>
<div class="stat"><div class="num" id="streak">0</div><div class="small">Streak</div></div>
<div class="stat"><div class="num">3</div><div class="small">Today</div></div>
</div>
<div class="actions" style="margin-top:16px">
<button class="primary" onclick="markDone()">✓ Mark today complete</button>
</div>
</div>

<div class="card">
<b>Quick practice</b>
<p class="small">Type one of today's words from memory.</p>
<input id="quiz" placeholder="Type a word...">
<div class="actions"><button class="primary" onclick="checkQuiz()">Check</button><button class="secondary" onclick="speakAll()">🔊 Hear words</button></div>
<p id="result" class="small"></p>
</div>

<footer>Your lessons change automatically each calendar day. Progress stays on this device.</footer>
</div>

const startDate=new Date("2026-01-01T00:00:00");
let offset=0;
const completed=JSON.parse(localStorage.getItem("threeWordsCompleted")||"[]");

function dayIndex(){
 const d=new Date(); d.setHours(0,0,0,0);
 const diff=Math.floor((d-startDate)/86400000);
 return ((diff%365)+365)%365;
}
function currentIndex(){ return (dayIndex()+offset+365)%365; }
function fmtDate(){
 return new Intl.DateTimeFormat(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"}).format(new Date());
}
function render(){
 const idx=currentIndex(), words=vocab[idx];
 document.getElementById("date").textContent=offset===0?fmtDate():"Lesson "+(idx+1);
 document.getElementById("day").textContent="Day "+(idx+1)+" / 365";
 document.getElementById("bar").style.width=((idx+1)/365*100)+"%";
 document.getElementById("progressText").textContent=(idx+1)+" of 365 daily lessons";
 document.getElementById("words").innerHTML=words.map((w,i)=>`
 <div class="card">
   <div class="small">WORD $365</div>
   <div class="word">$a</div>
   <div class="meaning">$b</div>
   <div class="example"><b>Example:</b> $a</div>
   <div class="actions"><button class="secondary" onclick="speak($364)">🔊 Listen</button><button class="primary" onclick="copyWord($364)">Copy word</button></div>
 </div>`).join("");
 document.getElementById("learned").textContent=completed.length;
 document.getElementById("streak").textContent=calcStreak();
}
function changeDay(n){ offset+=n; render(); window.scrollTo({top:0,behavior:"smooth"}); }
function speak(i){
 const u=new SpeechSynthesisUtterance(vocab[currentIndex()][i][0]+" — "+vocab[currentIndex()][i][1]+". "+vocab[currentIndex()][i][2]);
 u.rate=.8; speechSynthesis.cancel(); speechSynthesis.speak(u);
}
function speakAll(){ vocab[currentIndex()].forEach((_,i)=>setTimeout(()=>speak(i),i*3000)); }
function copyWord(i){ navigator.clipboard?.writeText(vocab[currentIndex()][i][0]); }
function markDone(){
 const key=new Date().toISOString().slice(0,10);
 if(!completed.includes(key)){completed.push(key);localStorage.setItem("threeWordsCompleted",JSON.stringify(completed));}
 render(); alert("Great! Today's 3 words are complete.");
}
function calcStreak(){
 let n=0,d=new Date();
 while(true){
  const k=d.toISOString().slice(0,10);
  if(completed.includes(k)){n++;d.setDate(d.getDate()-1)} else break;
  if(n>365)break;
 }
 return n;
}
function checkQuiz(){
 const answer=document.getElementById("quiz").value.trim().toLowerCase();
 const ok=vocab[currentIndex()].some(w=>w[0].toLowerCase()===answer);
 document.getElementById("result").textContent=answer?(ok?"✓ Correct — well done!":"Not one of today's words. Try again."):"Type a word first.";
}
render();
</script>
