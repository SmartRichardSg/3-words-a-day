<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>3 Words a Day</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:560px;margin:auto;padding:18px 16px 35px}
header{text-align:center;padding:12px 0 18px}
h1{font-size:30px;margin:0 0 5px}
.tag{color:#60708a;font-size:17px}
.card{background:#fff;border-radius:22px;padding:20px;margin:12px 0;box-shadow:0 5px 20px rgba(20,40,80,.08)}
.top{display:flex;justify-content:space-between;gap:10px;font-weight:700}
.day{color:#2563eb}
.progress{height:9px;background:#e2e8f0;border-radius:9px;margin-top:14px;overflow:hidden}
.bar{height:100%;background:#2563eb}
.small{font-size:14px;color:#65748b}
.word{font-size:30px;font-weight:800;margin:8px 0 5px}
.meaning{font-size:17px;color:#52627a}
.example{margin-top:14px;padding:14px;background:#eff6ff;border-radius:14px;line-height:1.5}
button{border:0;border-radius:14px;padding:13px 16px;font-size:15px;font-weight:700}
.primary{background:#2563eb;color:#fff}
.secondary{background:#e8eef7;color:#25344d}
.actions{display:flex;gap:9px;margin-top:14px}
.actions button{flex:1}
.nav{display:flex;gap:10px;margin:14px 0}
.nav button{flex:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat{background:#f6f8fb;border-radius:14px;padding:12px}
.num{font-size:22px;font-weight:800}
input{width:100%;padding:13px;border:1px solid #d7deea;border-radius:12px;font-size:16px}
.center{text-align:center}
footer{text-align:center;color:#718096;font-size:12px;margin-top:20px}
</style>
</head>
<body>
<div class="app">
<header><h1>3 Words a Day</h1><div class="tag">Small Steps. Better Every Day.</div></header>
<div class="card">
<div class="top"><span id="date"></span><span class="day" id="day"></span></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<p class="small" id="progressText"></p>
</div>
<div id="words"></div>
<div class="nav">
<button class="secondary" onclick="changeDay(-1)">← Previous</button>
<button class="secondary" onclick="changeDay(1)">Next →</button>
</div>
<div class="card center">
<div class="stats">
<div class="stat"><div class="num" id="learned">0</div><div class="small">Completed</div></div>
<div class="stat"><div class="num" id="streak">0</div><div class="small">Streak</div></div>
<div class="stat"><div class="num">3</div><div class="small">Words</div></div>
</div>
<div class="actions"><button class="primary" onclick="markDone()">✓ Mark today complete</button></div>
</div>
<div class="card">
<b>Quick practice</b>
<p class="small">Type one of today's words from memory.</p>
<input id="quiz" placeholder="Type a word...">
<div class="actions"><button class="primary" onclick="checkQuiz()">Check</button><button class="secondary" onclick="speakAll()">🔊 Hear words</button></div>
<p id="result" class="small"></p>
</div>
<footer>Day 1 starts on 21 September 2026. Your progress is saved on this device.</footer>
</div>
<script>
const lessons=[[["curious","wanting to learn or know more","A curious mind keeps asking useful questions."],["steady","firm, regular, and dependable","Steady practice is more useful than occasional bursts of effort."],["vivid","very clear and detailed in the mind","He has a vivid memory of his childhood home."]],[["concise","short but clear","Please give me a concise summary of the book."],["diligent","careful and hardworking","Her diligent practice improved her English."],["adapt","change to suit a new situation","We can adapt our routine when circumstances change."]],[["resilient","able to recover after difficulty","A resilient person keeps going after setbacks."],["gracious","kind and polite","She was gracious when receiving the compliment."],["subtle","small or not immediately obvious","There was a subtle change in his voice."]],[["thrive","grow or develop well","People often thrive when they have a clear purpose."],["humble","not overly proud","Despite his success, he remained humble."],["embrace","accept something willingly","He decided to embrace the new opportunity."]],[["eloquent","expressing ideas clearly and effectively","Her simple words were surprisingly eloquent."],["prudent","showing good judgment","Saving regularly is a prudent habit."],["optimistic","expecting good things to happen","He stayed optimistic about the future."]],[["persistent","continuing despite difficulty","Persistent effort eventually produces results."],["authentic","genuine and real","She values authentic conversations."],["reflect","think carefully about something","Take a few minutes to reflect on what you learned."]],[["coherent","logical and easy to understand","His explanation was coherent and easy to follow."],["generous","willing to give or share","She was generous with her time."],["cultivate","develop something through care and effort","Reading helps cultivate curiosity."]],[["nuance","a small but important difference","The discussion missed an important nuance."],["spontaneous","done without planning","They took a spontaneous walk after dinner."],["compassion","concern for another person's difficulties","Compassion changes how we treat other people."]],[["aspire","strongly hope to achieve something","He aspires to keep learning throughout life."],["resourceful","good at finding practical solutions","She is resourceful when problems arise."],["gratitude","thankfulness","A daily gratitude habit can improve your outlook."]],[["profound","very deep or meaningful","The book had a profound effect on him."],["flexible","able to change or adapt","A flexible plan is easier to maintain."],["persevere","continue despite difficulty","If you persevere, small improvements add up."]],[["enhance","improve the quality or value of something","Good lighting can enhance a photograph."],["serene","calm and peaceful","The garden was serene in the early morning."],["reliable","consistently dependable","A reliable routine makes learning easier."]],[["contemplate","think about something deeply","She took time to contemplate the decision."],["precise","exact and accurate","Please give me the precise time."],["encounter","meet or experience unexpectedly","You may encounter challenges along the way."]],[["inevitable","certain to happen","Change is an inevitable part of life."],["sustain","keep something going","Small habits help sustain long-term progress."],["vital","extremely important","Sleep is vital for good health."]],[["allocate","give something for a particular purpose","He decided to allocate thirty minutes to reading."],["improvise","create or perform without preparation","When the plan changed, they had to improvise."],["transform","change something significantly","Daily practice can transform your skills."]],[["commend","praise someone for something they did well","The teacher commended her steady effort."],["feasible","possible and practical","The goal is challenging but feasible."],["refine","improve something through small changes","She continued to refine her writing."]],[["mindful","aware and attentive","Try to be mindful of your breathing."],["equilibrium","a state of balance","Exercise can help maintain a healthy equilibrium."],["articulate","express an idea clearly","He can articulate complex ideas simply."]],[["innovative","introducing new ideas or methods","The team developed an innovative solution."],["abundant","more than enough","The garden produced an abundant harvest."],["credible","worthy of being believed","The report came from a credible source."]],[["acumen","the ability to make good judgments","His business acumen helped the company grow."],["affable","friendly and easy to talk to","Our new neighbour is very affable."],["agile","able to move or change quickly","An agile mind can adjust to new ideas."]],[["amiable","pleasant and friendly","He has an amiable personality."],["ample","enough or more than enough","We had ample time to finish the task."],["anticipate","expect something to happen","We anticipate a busy morning."]],[["astute","clever and good at judging situations","She made an astute observation."],["augment","increase or improve something","Walking can augment a regular exercise routine."],["bolster","support or strengthen","The new evidence helped bolster his argument."]],[["candid","honest and direct","He gave a candid answer to the question."],["capacity","the ability or amount that something can contain","The hall has a large seating capacity."],["catalyst","something that causes change","The book became a catalyst for a new habit."]],[["collaborate","work together","The two writers decided to collaborate."],["comprehensive","including everything important","She prepared a comprehensive plan."],["concede","admit that something is true","He had to concede that she was right."]],[["cordial","polite and friendly","They had a cordial conversation."],["cumulative","increasing through successive additions","The cumulative effect of small habits can be powerful."],["decisive","able to make decisions quickly and clearly","He took decisive action."]],[["discern","notice or recognize something","With practice, you can discern small differences."],["discreet","careful not to attract attention","She was discreet about the private matter."],["distinct","clearly different","The two ideas are quite distinct."]],[["efficient","working well without wasting time or effort","A simple routine can be very efficient."],["empathetic","able to understand another person's feelings","An empathetic listener makes people feel heard."],["endure","continue through something difficult","He learned to endure temporary discomfort."]],[["enthusiastic","very interested and excited","She is enthusiastic about learning languages."],["evaluate","judge the quality or value of something","Take time to evaluate your progress."],["facilitate","make something easier","Good notes facilitate later revision."]],[["flourish","grow or develop successfully","Plants flourish with enough sunlight."],["formidable","very difficult or impressive","Learning a language can seem formidable at first."],["frugal","careful about spending money","He is frugal without being stingy."]],[["genuine","real and sincere","Her smile looked genuine."],["gradual","happening slowly over time","Gradual improvement is easier to maintain."],["holistic","considering the whole rather than one part","She takes a holistic approach to learning."]],[["impartial","not favoring one side","A good referee should remain impartial."],["ingenious","clever and inventive","He found an ingenious way to organize his notes."],["integrity","honesty and strong moral principles","People trust her because she acts with integrity."]],[["intuitive","understood naturally without conscious reasoning","The new app feels intuitive to use."],["judicious","showing careful and sensible judgment","He made a judicious choice."],["momentum","the force that keeps something developing","Once the habit starts, it creates momentum."]]];
const START=new Date("2026-09-21T00:00:00");
let offset=0;
const completed=JSON.parse(localStorage.getItem("threeWordsCompleted")||"[]");

function realDay(){
 const d=new Date(); d.setHours(0,0,0,0);
 return Math.floor((d-START)/86400000);
}
function idx(){
 let n=realDay()+offset;
 n=Math.max(0,Math.min(lessons.length-1,n));
 return n;
}
function render(){
 const i=idx(), ws=lessons[i];
 const d=new Date(START); d.setDate(d.getDate()+i);
 document.getElementById("date").textContent=d.toLocaleDateString(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"});
 document.getElementById("day").textContent="Day "+(i+1)+" / 30";
 document.getElementById("bar").style.width=((i+1)/30*100)+"%";
 document.getElementById("progressText").textContent=(i+1)+" of 30 starter lessons";
 document.getElementById("words").innerHTML=ws.map((w,n)=>`
 <div class="card">
 <div class="small">WORD ${n+1}</div>
 <div class="word">${w[0]}</div>
 <div class="meaning">${w[1]}</div>
 <div class="example"><b>Example:</b> ${w[2]}</div>
 <div class="actions"><button class="secondary" onclick="speak(${n})">🔊 Listen</button></div>
 </div>`).join("");
 document.getElementById("learned").textContent=completed.length;
 document.getElementById("streak").textContent=streak();
}
function changeDay(n){offset+=n;render();scrollTo({top:0,behavior:"smooth"})}
function speak(n){
 const w=lessons[idx()][n],u=new SpeechSynthesisUtterance(w[0]+". "+w[1]+". "+w[2]);
 u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u);
}
function speakAll(){for(let n=0;n<3;n++)setTimeout(()=>speak(n),n*3000)}
function markDone(){
 const k=new Date().toISOString().slice(0,10);
 if(!completed.includes(k)){completed.push(k);localStorage.setItem("threeWordsCompleted",JSON.stringify(completed))}
 render();alert("Great! Today's 3 words are complete.");
}
function streak(){
 let n=0,d=new Date();
 while(completed.includes(d.toISOString().slice(0,10))){n++;d.setDate(d.getDate()-1);if(n>365)break}
 return n;
}
function checkQuiz(){
 const a=document.getElementById("quiz").value.trim().toLowerCase();
 const ok=lessons[idx()].some(w=>w[0].toLowerCase()===a);
 document.getElementById("result").textContent=!a?"Type a word first.":ok?"✓ Correct — well done!":"Not one of today's words. Try again.";
}
render();
</script>
</body>
</html>
